name: CI

# TEST-005: build/test gate (SDD-MC-001.md §13.4 "Continuous Validation";
# follow-up flagged by TEST-002's own AC for "CI wiring, if CI exists").
#
# Every PR and every push to main: build ros2-core (cached, not rebuilt
# from scratch each run), fetch px4_msgs, colcon-build the whole workspace,
# and colcon-test it. ament_lint_auto (cpplint/cppcheck/uncrustify/xmllint)
# is NOT a separate step here — docs/TESTING.md and docs/CONTRIBUTING.md
# are explicit that every package already wires it into its own
# `if(BUILD_TESTING)` block, so `colcon test` already runs it alongside the
# gtest suites; a clean `colcon test-result` means lint passed too. Adding
# a second lint job would just run the same checks twice.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships with ~14GB free after its preinstalled
      # toolchains — not enough headroom for the dustynv L4T base image
      # (several GB on its own) plus QEMU-emulated colcon build output plus
      # buildx's cache export. Reclaim space from toolchains this job never
      # uses rather than relying on default headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY}" || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          docker image prune -af || true
          df -h /

      # ros2-core (docker/ros2-core/Dockerfile) is FROM dustynv/ros:humble-
      # ros-base-l4t-r36.3.0 — a Jetson L4T (aarch64-only) base image, same
      # as every service image built FROM it. scripts/04-install-ros2-core.sh
      # already documents the fix for this on an x86 CI host: install QEMU
      # so the aarch64 layers execute. This is real cross-arch emulation
      # (not a native build), so C++ compilation inside it is meaningfully
      # slower than a native amd64 build would be — that's an accepted
      # cost of testing against the actual production base image rather
      # than a stand-in x86 ROS image; a self-hosted arm64 runner would
      # remove it but is out of scope for this ticket.
      - name: Set up QEMU (aarch64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # AC: "build ... (or cache/reuse it — full rebuild on every PR is
      # wasteful)". This was originally a docker/build-push-action step
      # using the docker-container buildx driver with `load: true` +
      # `cache-to: type=gha` — that driver builds the image, exports it
      # to an OCI tarball, then re-imports it into the daemon, so at peak
      # it holds ~3 copies of this image (build cache + tarball +
      # imported layers) at once. dustynv/ros:humble-ros-base-l4t-r36.3.0
      # is a full Jetson L4T/CUDA/TensorRT userland image (single layers
      # up to 3.48GB), not a small ROS image, and that tripled peak
      # blew straight through the runner's disk mid-import ("no space
      # left on device" writing libnvinfer_static.a). Plain `docker build`
      # uses the default (non-container) buildx driver, which builds
      # directly into the daemon's own image store — one copy, no
      # export/import round trip. The trade-off: the default driver
      # doesn't support the `type=gha` cache exporter, so this no longer
      # caches our own apt-get layer across runs — acceptable here since
      # every run is a fresh ephemeral VM anyway, so the dominant cost
      # (pulling/extracting the ~6.5GB compressed base image itself) is
      # re-paid every run regardless of whether our thin layer on top was
      # cached. "Reuse" is still satisfied within a run: this same
      # ros2-core:ci is what both the colcon build/test step and the
      # summary step below run against, nothing rebuilds it twice.
      - name: Build ros2-core
        run: |
          docker build \
            --platform linux/arm64 \
            --tag ros2-core:ci \
            --file docker/ros2-core/Dockerfile \
            docker/ros2-core
          docker builder prune -af || true

      # fcc_bridge depends on px4_msgs (SDD-MC-001 §3), which is one of the
      # 7 first-party packages' dependencies but is fetched via
      # ws/px4_msgs.repos rather than vendored (see ws/.gitignore) —
      # same step scripts/05-build-workspace.sh runs before every build.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch px4_msgs (ws/px4_msgs.repos)
        run: |
          pip install --user vcstool
          ~/.local/bin/vcs import --skip-existing ws/src < ws/px4_msgs.repos

      # Whole-workspace build + test inside ros2-core, matching
      # docs/TESTING.md's "Native package development" recipe (colcon
      # build/test "in the ros2-core container"), not the production
      # runtime pattern (docs/DEPLOYMENT.md's read-only install bind-mount)
      # — CI needs build/, install/, and log/ all writable so test results
      # can be copied back out afterward.
      - name: colcon build + colcon test
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ws/build" "${GITHUB_WORKSPACE}/ws/install" "${GITHUB_WORKSPACE}/ws/log"
          docker run --rm \
            --platform linux/arm64 \
            --volume "${GITHUB_WORKSPACE}/ws:/ws" \
            --workdir /ws \
            ros2-core:ci \
            bash -c "
              set -eo pipefail
              source /opt/ros/humble/install/setup.bash
              set -u
              colcon build \
                --merge-install \
                --cmake-args -DCMAKE_BUILD_TYPE=Release \
                --event-handlers console_cohesion+
              source install/setup.bash
              colcon test --merge-install --event-handlers console_cohesion+
              colcon test-result --all --verbose
            "

      # AC: "Build/test status and result artifacts ... visible on the PR,
      # not just in a log someone has to go find." GITHUB_STEP_SUMMARY
      # renders directly on the job summary/PR checks tab with no extra
      # marketplace action; the raw per-package XML (gtest + ament_lint's
      # own xunit output) goes up as an artifact for anyone who wants the
      # detail colcon test-result's console output doesn't show.
      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## colcon test-result"
            echo '```'
            docker run --rm \
              --platform linux/arm64 \
              --volume "${GITHUB_WORKSPACE}/ws:/ws" \
              --workdir /ws \
              ros2-core:ci \
              bash -c "source /opt/ros/humble/install/setup.bash && colcon test-result --all --verbose" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-results
          path: |
            ws/build/*/test_results/**
            ws/log/latest_test/**
          if-no-files-found: warn
          retention-days: 14
