# /etc/netplan/01-drone-mc.yaml — Jetson eth0 configuration.
# Installed by scripts/01-install-os.sh (TP-SM-001). HID-MC-001 §4.2 (HIF-002), §6.2 (HIF-004).
#
# The Jetson Orin NX built-in NIC does not enumerate as "eth0" — it gets a
# PCIe-path predictable name from systemd (observed: enP8p1s0; this can
# differ across baseboards/kernels). `match`+`set-name` below renames
# whatever the kernel calls it to "eth0" at boot, so every other doc/script
# in this repo (HID-MC-001, health checks, tcpdump commands, etc.) can keep
# referring to the stable logical name "eth0".
#
# Match by MAC address, not by name. udev's own predictable-naming rule
# renames the kernel's default "eth0" to "enP8p1s0" as part of the same
# early `add` uevent this rule fires on — matching by `name: enP8p1s0` is a
# race against that rename and was observed to fail silently on cold boot
# (interface stayed "enP8p1s0", unmanaged, no IPs) even though a manual
# `netplan apply` after boot renamed it fine. Matching by macaddress uses a
# stable hardware property available before any renaming happens, so it
# resolves deterministically every boot. If the NIC (and thus its MAC) is
# ever replaced, update `match.macaddress` here.
#
# INFRA-008: this file is an envsubst template, not the file installed
# directly — scripts/01-install-os.sh renders it against
# /etc/drone-mc/environment's MC_ETH_MAC/MC_ETH_IP before installing to
# /etc/netplan/01-drone-mc.yaml. Provisioning a second physical unit is:
# edit those two values in that drone's
# /etc/drone-mc/environment, re-run 01-install-os.sh — no hand-editing of
# this file or the rendered netplan output.
#
# eth0 carries one address, MC_ETH_IP/24 (192.168.100.11 by default), on
# the single 192.168.100.x subnet shared by the GCS, peer MCs (HIF-004) and
# this drone's own Pixhawk (HIF-002, FCC_ETH_IP). There is no separate
# MC<->FCC subnet: the Pixhawk's NuttX stack has only one IPv4 address.
#
# The MC_ETH_DNS_LIST/MC_ETH_ROUTES_YAML placeholders below are not raw
# environment values.
# 01-install-os.sh derives them from the optional MC_ETH_DNS/MC_ETH_GATEWAY:
# both empty (the flight default) renders `addresses: []` and no routes,
# i.e. no default route and no resolver.
network:
  version: 2
  ethernets:
    eth0:
      match:
        macaddress: ${MC_ETH_MAC}
      set-name: eth0
      addresses:
        - ${MC_ETH_IP}/24
      nameservers:
        addresses: [${MC_ETH_DNS_LIST}]
${MC_ETH_ROUTES_YAML}
