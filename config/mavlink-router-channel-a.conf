# /etc/drone-mc/mavlink-router-channel-a.conf
# Channel A: GCS <-> FCC (standard PX4 autopilot MAVLink), port 14550
# (ICD §4.1/§4.2/§9.2, HID §6.3, GCS-001/MAVR-001/GCS-005).
#
# Loaded by its own mavlink-routerd process (docker/mavlink-router/entrypoint.sh),
# never the same process as mavlink-router-channel-b.conf. mavlink-router
# meshes every endpoint in one config together, so isolation between the two
# GCS channels can only be guaranteed by running two independent processes.
#
# GCS_CHANNEL_A listens on the MC's own address (192.168.10.11:14550,
# Docker --network=host) for the GCS's outbound autopilot MAVLink;
# FCC_CHANNEL_A relays it on to the FCC.
#
# MAVROS_CHANNEL_A (GCS-005) is a deliberate, reviewed exception to this
# file's former "no endpoint here that any MC application node can reach"
# guarantee — mavlink-router has no read-only tap mode (every endpoint in
# one config is bidirectionally bridged), so giving MAVROS (running in the
# gcs-comms container, SDD §11.1) live vehicle telemetry means it can also
# inject onto this same live GCS<->FCC link. The guarantee this file now
# actually provides is narrower: no *accidental/unreviewed* endpoint reaches
# Channel A, not that MC can never reach it at all. mavlink_router still
# isolates Channel A from Channel B/C exactly as before — that isolation is
# unaffected, since MAVROS is only ever a third participant within this one
# process, never a bridge across to another channel's process.
#
# INFRA-008: this file is an envsubst template, not the file installed
# directly — scripts/02-install-systemd-units.sh renders it against
# /etc/drone-mc/environment's FCC_ETH_IP (this drone's own Pixhawk's
# single Ethernet address) before installing to
# /etc/drone-mc/mavlink-router-channel-a.conf. A second physical unit's
# Pixhawk address is set by editing that drone's FCC_ETH_IP, not this file.
[General]
TcpServerPort = 0
ReportStats = false

[UdpEndpoint GCS_CHANNEL_A]
Mode = Server
Address = 0.0.0.0
Port = 14550

[UdpEndpoint FCC_CHANNEL_A]
Mode = Normal
Address = ${FCC_ETH_IP}
Port = 14550

[UdpEndpoint MAVROS_CHANNEL_A]
Mode = Normal
Address = 127.0.0.1
Port = 14553
