# /etc/drone-mc/mavlink-router-channel-a.conf
# Channel A: GCS <-> FCC (standard PX4 autopilot MAVLink), port 14550
# (ICD §4.1/§9.2, HID §6.3, GCS-001/MAVR-001).
#
# Loaded by its own mavlink-routerd process (docker/mavlink-router/entrypoint.sh),
# never the same process as mavlink-router-channel-b.conf. mavlink-router
# meshes every endpoint in one config together, so isolation between the two
# GCS channels can only be guaranteed by running two independent processes —
# there is deliberately no endpoint here that any MC application node can
# reach, so nothing on this box can inject onto Channel A even by accident.
#
# GCS_CHANNEL_A listens on the MC's own address (192.168.10.11:14550,
# Docker --network=host) for the GCS's outbound autopilot MAVLink; the
# FCC_CHANNEL_A endpoint is the only other endpoint in this process, so
# mavlink-routerd's default all-endpoints-bridged behavior reduces to a
# straight two-party relay.
[General]
TcpServerPort = 0
ReportStats = false

[UdpEndpoint GCS_CHANNEL_A]
Mode = Server
Port = 14550

[UdpEndpoint FCC_CHANNEL_A]
Mode = Normal
Address = 192.168.10.31
Port = 14550
