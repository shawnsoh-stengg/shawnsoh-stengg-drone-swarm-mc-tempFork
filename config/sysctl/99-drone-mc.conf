# CycloneDDS socket buffer floor (INFRA-004, docker/ros2-core/cyclonedds.xml
# <SocketReceiveBufferSize min="10MB"/> / <SocketSendBufferSize min="1MB"/>).
# net.core.rmem_max/wmem_max are global (non-namespaced) kernel sysctls, so
# setting them on the Jetson host also covers every drone-mc container
# regardless of network mode. Stock Ubuntu ships far below CycloneDDS's
# floor (~416KB rmem_max) — without this, rmw_cyclonedds_cpp fails
# SO_RCVBUF/SO_SNDBUF and every DDS-using node aborts on startup with
# "failed to create domain".
#
# Headroom above the 10MB/1MB mins for future cyclonedds.xml tuning.
net.core.rmem_max = 16777216
net.core.wmem_max = 4194304
