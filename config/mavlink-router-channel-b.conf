# /etc/drone-mc/mavlink-router-channel-b.conf
# Channel B: GCS <-> MC (gcs_mavlink_node) only (ICD §4.1/§4.2/§9.2,
# GCS-001/MAVR-001).
#
# Loaded by its own mavlink-routerd process (docker/mavlink-router/entrypoint.sh),
# independent of mavlink-router-channel-a.conf — see that file's header for
# why isolation requires two separate processes rather than one shared config.
#
# Dedicated, non-standard ports (14551/14552) rather than reusing 14550, so
# QGroundControl's autodetect on 14550 (Channel A) is never confused with
# this channel. GCS_MAVLINK_NODE is the only MC-facing endpoint in this
# process — gcs_mavlink_node listens on that loopback port for everything
# mavlink-router relays in from the GCS, and publishes back out through it.
[General]
TcpServerPort = 0
ReportStats = false

[UdpEndpoint GCS_CHANNEL_B]
Mode = Normal
Address = 192.168.10.10
Port = 14551

[UdpEndpoint GCS_MC_RECV]
Mode = Server
Address = 0.0.0.0
Port = 14552

[UdpEndpoint GCS_MAVLINK_NODE]
Mode = Normal
Address = 127.0.0.1
Port = 14560
