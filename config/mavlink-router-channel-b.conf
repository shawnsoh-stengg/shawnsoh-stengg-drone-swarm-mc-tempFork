# /etc/drone-mc/mavlink-router-channel-b.conf
# Channel B: GCS <-> MC (gcs_mavlink_node) only (ICD §4.1/§4.2/§9.2,
# GCS-001/MAVR-001).
#
# Loaded by its own mavlink-routerd process (docker/mavlink-router/entrypoint.sh),
# independent of mavlink-router-channel-a.conf — see that file's header for
# why isolation requires two separate processes rather than one shared config.
#
# Dedicated, non-standard ports (14551/14552) rather than reusing 14550, so
# QGroundControl's autodetect on 14550 (Channel A) is never confused with
# this channel. GCS_MAVLINK_NODE is the only MC-facing endpoint in this
# process — gcs_mavlink_node listens on that loopback port for everything
# mavlink-router relays in from the GCS, and publishes back out through it.
#
# INFRA-008: this file is an envsubst template, not the file installed
# directly — scripts/02-install-systemd-units.sh renders it against
# /etc/drone-mc/environment's GCS_IP before installing to
# /etc/drone-mc/mavlink-router-channel-b.conf. GCS_IP is fleet-wide (same
# GCS laptop for every drone), so this substitution exists for a single
# source of truth, not per-drone variance.
[General]
TcpServerPort = 0
ReportStats = false

#
# GCS_CHANNEL_B is the only egress to the GCS; GCS_MC_RECV is ingress-only.
# Without that split, a GCS that sends from its own listen port (the TEST-004
# sim, the TEST-007 panel) gets every MC frame twice: once via the fixed
# GCS_IP:14551 target, once via GCS_MC_RECV, which learned that same
# address:port as its client. AllowSrcSysOut = 0 forwards nothing out
# (sysid 0 is never a valid MAVLink source). Group = gcs shares the sysids
# GCS_MC_RECV learns with GCS_CHANNEL_B, so mavlink-router's own loop check
# stops it echoing the GCS's broadcasts (HEARTBEAT) back to the GCS on 14551.
[UdpEndpoint GCS_CHANNEL_B]
Mode = Normal
Address = ${GCS_IP}
Port = 14551
Group = gcs

[UdpEndpoint GCS_MC_RECV]
Mode = Server
Address = 0.0.0.0
Port = 14552
Group = gcs
AllowSrcSysOut = 0

[UdpEndpoint GCS_MAVLINK_NODE]
Mode = Normal
Address = 127.0.0.1
Port = 14560
