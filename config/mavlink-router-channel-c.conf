# /etc/drone-mc/mavlink-router-channel-c.conf
# Channel C: Mission Orchestrator <-> MC (mission_orchestrator_node) only
# (ICD IFD-008 §12.1, GCS-004).
#
# Loaded by its own mavlink-routerd process, independent of
# mavlink-router-channel-a.conf and -channel-b.conf — same isolation
# rationale as those two: a bug or flood on one channel cannot affect
# another, and QGC's autodetect on 14550 is never confused with this
# channel's ports either.
#
# ORCHESTRATOR_MAVLINK_NODE is the only MC-facing endpoint in this
# process — mission_orchestrator_node listens on that loopback port for
# everything mavlink-router relays in from the Orchestrator, and publishes
# back out through it. This includes MAVFTP's FILE_TRANSFER_PROTOCOL
# messages — mavlink-router routes them like any other MAVLink message; it
# has no awareness that MAVFTP is a file-transfer microservice riding on
# top.
#
# INFRA-008: this file is an envsubst template, not the file installed
# directly — scripts/02-install-systemd-units.sh renders it against
# /etc/drone-mc/environment's GCS_IP before installing to
# /etc/drone-mc/mavlink-router-channel-c.conf. GCS_IP is fleet-wide (the
# Orchestrator is assumed co-located with the GCS laptop), so this
# substitution exists for a single source of truth, not per-drone variance.
[General]
TcpServerPort = 0
ReportStats = false

# ORCHESTRATOR_CHANNEL_C is the only egress to the Orchestrator;
# ORCHESTRATOR_MC_RECV is ingress-only (AllowSrcSysOut = 0) and grouped with
# it — same double-delivery and echo fix as mavlink-router-channel-b.conf,
# see that file's comment above GCS_CHANNEL_B.
[UdpEndpoint ORCHESTRATOR_CHANNEL_C]
Mode = Normal
Address = ${GCS_IP}
Port = 14571
Group = orchestrator

# Address = 0.0.0.0 is required, not just conventional (matching
# mavlink-router-channel-b.conf's own GCS_MC_RECV) — this build of
# mavlink-router (see docker/mavlink-router/Dockerfile's pinned commit)
# refuses to start at all without it: "Required field 'address' not found
# in section 'UdpEndpoint ORCHESTRATOR_MC_RECV'" (TEST-004, found via a
# real mavlink-routerd run against this file).
[UdpEndpoint ORCHESTRATOR_MC_RECV]
Mode = Server
Address = 0.0.0.0
Port = 14572
Group = orchestrator
AllowSrcSysOut = 0

[UdpEndpoint ORCHESTRATOR_MAVLINK_NODE]
Mode = Normal
Address = 127.0.0.1
Port = 14580
