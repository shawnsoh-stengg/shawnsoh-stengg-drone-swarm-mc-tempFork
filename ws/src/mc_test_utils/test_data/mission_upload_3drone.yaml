# TP-MC-001 §3.4 fixture: a mission upload usable by 1-3 drones (trim the
# formation_offsets/swarm_manifest lists to however many a scenario needs).
# Consumed by mavlink_gcs_client's *_item() helpers (ws/src/mc_test_utils/
# mc_test_utils/mavlink_gcs_client.py), not loaded directly by any node --
# gcs_mavlink_node only ever receives a mission over the real MAVLink
# MISSION_COUNT/MISSION_ITEM_INT protocol, never a YAML file.
#
# ingress_waypoint/muster_point lat/lon are deliberately tiny
# (near-(0,0), not a real-world location) rather than a realistic
# geodetic position. This is a workaround for a real, separate limitation
# TEST-002 surfaced but did not fix (out of scope -- a mission_exec change,
# not a test-harness one): mission_manager_node's guard_ingress_to_muster()
# compares MissionUpload.ingress_waypoints[].pose.position.x/y (which
# gcs_mavlink_node's decode_ingress_or_muster_item() populates with raw
# lat/lon *degrees*, ICD §4.6) directly against VehicleState.x/y (local
# NED *metres*) with no unit conversion -- comparing degrees to metres.
# Keeping both waypoints' lat/lon within ~0.001 degrees of (0,0) keeps that
# comparison's magnitude trivially small (fractions of a "metre" either
# way) regardless of the unit mismatch, so the guard is satisfiable without
# masking the underlying bug or needing to fix mission_exec's own guard
# logic under this ticket. See PROJECT-PLAN-5-MONTH.md's TEST-002 entry.
ingress_waypoint:
  lat_deg: 0.00010
  lon_deg: 0.00010
  alt_m: 30.0
muster_point:
  lat_deg: 0.00010
  lon_deg: 0.00010
  alt_m: 30.0
search_polygon:
  - lat_deg: 0.00010
    lon_deg: 0.00010
  - lat_deg: 0.00020
    lon_deg: 0.00010
  - lat_deg: 0.00020
    lon_deg: 0.00020
formation_offsets:
  - drone_id: 1
    n_m: 0.0
    e_m: 0.0
    d_m: 0.0
  - drone_id: 2
    n_m: 5.0
    e_m: 0.0
    d_m: 0.0
  - drone_id: 3
    n_m: 0.0
    e_m: 5.0
    d_m: 0.0
swarm_manifest:
  - drone_id: 1
    ip_octet3: 10
    ip_octet4: 11
  - drone_id: 2
    ip_octet3: 10
    ip_octet4: 12
  - drone_id: 3
    ip_octet3: 10
    ip_octet4: 13
