# TP-MC-001 §3.4 fixture: a mission upload usable by 1-3 drones (trim the
# formation_offsets/swarm_manifest lists to however many a scenario needs).
# Consumed by mavlink_gcs_client's *_item() helpers (ws/src/mc_test_utils/
# mc_test_utils/mavlink_gcs_client.py), not loaded directly by any node --
# gcs_mavlink_node only ever receives a mission over the real MAVLink
# MISSION_COUNT/MISSION_ITEM_INT protocol, never a YAML file.
#
# Positions sit around PX4 SITL/SIH's default home (SIH_LOC_LAT0/LON0,
# 47.397742, 8.545594), so the ingress route is a short real flight: ~30 m
# north to the ingress waypoint, then ~30 m east to the muster point.
# mission_manager_node uploads these as the FCC mission for INGRESS and
# checks arrival against the vehicle's lat/lon. alt_m is metres above home,
# like takeoff_altitude_m. (These used to be pinned near (0,0) to dodge
# guard_ingress_to_muster() comparing lat/lon degrees against local NED
# metres -- fixed, so that workaround is gone; as a real mission, (0,0)
# would now be a flight to Null Island.)
ingress_waypoint:
  lat_deg: 47.398012
  lon_deg: 8.545594
  alt_m: 30.0
muster_point:
  lat_deg: 47.398012
  lon_deg: 8.545994
  alt_m: 30.0
search_polygon:
  - lat_deg: 47.398012
    lon_deg: 8.545994
  - lat_deg: 47.398462
    lon_deg: 8.545994
  - lat_deg: 47.398462
    lon_deg: 8.546594
formation_offsets:
  - drone_id: 1
    n_m: 0.0
    e_m: 0.0
    d_m: 0.0
  - drone_id: 2
    n_m: 5.0
    e_m: 0.0
    d_m: 0.0
  - drone_id: 3
    n_m: 0.0
    e_m: 5.0
    d_m: 0.0
swarm_manifest:
  - drone_id: 1
    ip_octet3: 100
    ip_octet4: 11
  - drone_id: 2
    ip_octet3: 100
    ip_octet4: 12
  - drone_id: 3
    ip_octet3: 100
    ip_octet4: 13
