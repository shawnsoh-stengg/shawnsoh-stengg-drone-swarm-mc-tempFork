# MAVROS (built from source, docker/gcs-comms/Dockerfile — DEP-009
# follow-up, 2026-09-15: ros-humble-mavros's apt binary was pulled
# upstream; not a gcs_comms build/link dependency either way, see
# CMakeLists.txt's own header comment on why gcs_mavlink_node deliberately
# doesn't link MAVROS, which this file does not change). Minimal override
# on top of mavros_node's own defaults —
# everything else (plugin allowlist, message rates) is whatever the
# package ships out of the box.
#
# fcu_url points at mavlink-router-channel-a.conf's MAVROS_CHANNEL_A
# endpoint (ICD-MC-001.md §4.2) — a mirror of the live GCS<->FCC vehicle
# telemetry, not gcs_mavlink_node's own Channel B (GCS-005, SDD-MC-001.md
# §11.1). "udp://:14553@" binds locally and learns the remote address from
# the first packet mavlink-router relays in, same convention
# gcs_mavlink_node/mission_orchestrator_node use for their own loopback
# sockets (no fixed, advertisable remote address either).
#
# target_system_id is overridden at container start via --ros-args -p
# (docker/gcs-comms/entrypoint.sh, DRONE_ID env var) — the default below
# only applies to a standalone `ros2 run mavros mavros_node` invocation
# without that override.
#
# Top-level key must be `mavros_node`, not `mavros` — that's the node's
# actual ROS name (`ros2 run mavros mavros_node` doesn't rename it, and
# its own startup log identifies itself as `[mavros_node]`). A `mavros:`
# key silently never matches, so every value below is ignored rather than
# erroring — confirmed against a real ros-humble-mavros install: fcu_url
# under `mavros:` left "FCU URL:" blank in the node's own startup log,
# while the same value under `mavros_node:` (or via -p) applied correctly.
mavros_node:
  ros__parameters:
    fcu_url: "udp://:14553@"
    fcu_protocol: "v2.0"
    target_system_id: 1
    target_component_id: 1
