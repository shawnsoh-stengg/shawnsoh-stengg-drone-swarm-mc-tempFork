# HEALTH-001: resource-sampling tunables (SDD-MC-001 §10.1).
# HEALTH-002: node_alive_mask liveness timeouts (§10.2) and the
# mission_manager_node heartbeat watchdog (FR-074).
# HEALTH-003: failsafe decision tree (§10.3) and systemd-restart transport
# (§10.4) tunables.
# INFRA-007: vision.service cgroup memory sustained-threshold alerting.
health_monitor_node:
  ros__parameters:
    sample_period_s: 1.0
    proc_stat_path: "/proc/stat"
    meminfo_path: "/proc/meminfo"
    disk_path: "/var/drone-mc"
    cpu_thermal_zone_paths: ["/sys/class/thermal/thermal_zone0/temp"]
    gpu_thermal_zone_paths: ["/sys/class/thermal/thermal_zone1/temp"]
    # FR-074: mission_manager_node heartbeat (/mc/manager/heartbeat)
    # silence threshold. Also this node's node_alive_mask timeout for the
    # MISSION_MANAGER_ALIVE bit -- one value serves both.
    manager_heartbeat_timeout_s: 5.0
    fcc_bridge_node_timeout_s: 2.0
    gcs_mavlink_node_timeout_s: 2.0
    swarm_coordinator_node_timeout_s: 3.0
    camera_node_timeout_s: 3.0
    perception_down_node_timeout_s: 10.0
    visual_localisation_node_timeout_s: 5.0
    perception_front_node_timeout_s: 3.0
    video_mux_node_timeout_s: 2.0
    # FR-075: cooldown between successive mission-exec.service restart
    # attempts while mission_manager_node's heartbeat stays silent -- long
    # enough for systemd's restart and the process's own re-init to have a
    # real chance at a fresh heartbeat before the next attempt is judged.
    manager_restart_retry_s: 10.0
    # SDD §10.1: GPU_OVERTEMP threshold.
    gpu_overtemp_threshold_c: 85
    # INFRA-007/ICD §10.8: VISION_MEM_HIGH -- vision.service cgroup memory
    # usage (memory.current/memory.max, drone-mc-vision.service's Slice=
    # be.slice + MemoryMax=6G) at or above this percent-of-cap, sustained
    # for vision_mem_sustained_s, fires the fault. 30s is long enough that a
    # brief TensorRT engine (re)load spike doesn't false-alarm, short enough
    # that a genuine leak toward the 6G cap is caught with headroom to
    # spare before OOM-kill.
    vision_mem_threshold_pct: 80
    vision_mem_sustained_s: 30.0
    vision_cgroup_memory_current_path: "/sys/fs/cgroup/be.slice/drone-mc-vision.service/memory.current"
    vision_cgroup_memory_max_path: "/sys/fs/cgroup/be.slice/drone-mc-vision.service/memory.max"
    # SDD §10.4: drone-mc-watchdog privileged-helper Unix socket.
    watchdog_socket_path: "/var/run/drone-mc/watchdog.sock"
    watchdog_timeout_ms: 500
