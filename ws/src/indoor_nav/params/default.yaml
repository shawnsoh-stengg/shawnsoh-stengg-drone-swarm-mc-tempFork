# IGS-001: gnss_sim_node dead-reckoning fusion core tunables.
gnss_sim_node:
  ros__parameters:
    # A /mc/sensors/optical_flow sample arriving more than this many
    # seconds after the previous one is dropped from integration rather
    # than integrated across a stale/glitched gap. IGS-005 owns the real
    # staleness *fault*; this is just the fusion core's own sanity bound.
    max_flow_dt_s: 0.5

    # FT-006: first-order low-pass time constant on the baro-derived
    # vertical rate (vz_, sent as HIL_GPS vd). Unfiltered, ~0.1 m of baro
    # jitter at 10 Hz became ~1 m/s of vd and failed PX4's "vertical
    # velocity unstable" preflight check. <= 0 disables the filter.
    baro_vz_filter_tau_s: 0.5

    # IGS-004: HIL_GPS sender (ICD-MC-001.md §3.3b). 5 Hz is comfortably
    # inside PX4 EKF2's own GNSS timing bounds (confirmed against the real
    # v1.14.4 src/modules/ekf2/EKF/common.h's GNSS_MAX_INTERVAL = 500 ms) --
    # see send_hil_gps()'s own doc comment for the full verification.
    hil_gps_rate_hz: 5.0
    # Honest satellites_visible model, tied to the same eph PX4's own EKF2
    # accuracy gate (EKF2_REQ_EPH, default 3.0 m) uses -- degrades from
    # hil_gps_sats_at_anchor down to hil_gps_min_sats as eph grows, never a
    # fixed placeholder. See send_hil_gps()'s own doc comment.
    hil_gps_sats_at_anchor: 10.0
    hil_gps_min_sats: 4.0

    # IGS-005: real-GPS lockout, staleness/drift watchdog, waypoint-
    # deviation sanity bound. gnss_ok_hdop_threshold matches VIS-002/SDD
    # §8.3's own gnss_ok() threshold exactly (fix_type >= 3 is hardcoded,
    # not parameterized, since it's not a tunable -- it's the MAVLink GPS
    # fix-quality convention).
    gnss_ok_hdop_threshold: 2.0
    input_staleness_timeout_s: 1.0
    max_eph_before_fault_m: 5.0
    max_waypoint_deviation_m: 50.0
